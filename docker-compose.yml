# NOTE: Laya does NOT publish an official Docker image at time of writing.
# The recommended path is to install Laya as a Python package instead:
#
#     pip install "laya[serve]"
#     laya-serve                    # binds 0.0.0.0:8000
#
# See README.md for the full setup. This file is kept as a placeholder in
# case a Docker image is published later; adjust `image:` to whatever the
# Laya project ships and delete this comment.

services:
  laya:
    # image: nandhakishorm/laya:latest   # <-- unofficial guess, likely wrong
    build:
      context: https://github.com/NandhaKishorM/laya.git
    container_name: jarvis-laya
    ports:
      - "8000:8000"
    environment:
      - LAYA_DEVICE=cpu
      - LAYA_PRELOAD=1
    restart: unless-stopped
