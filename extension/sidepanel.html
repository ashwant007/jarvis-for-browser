<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <h1>Jarvis</h1>
    <span id="status" class="status idle">idle</span>
  </header>

  <section class="input">
    <textarea id="prompt" rows="3" placeholder="What should I do? (e.g. 'search hacker news for AI agents and open the top result')"></textarea>
    <div class="row">
      <button id="mic" title="Voice">Mic</button>
      <button id="paste" title="Paste">Paste</button>
      <label class="btn" title="Image">
        Image
        <input type="file" id="image" accept="image/*" hidden />
      </label>
      <button id="run" class="primary">Run</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <div id="pastePreview" class="preview hidden"></div>
    <div id="imagePreview" class="preview hidden"></div>
  </section>

  <section class="confirm hidden" id="confirmBox">
    <div id="confirmText"></div>
    <div class="row">
      <button id="confirmYes" class="primary">Confirm</button>
      <button id="confirmNo">Cancel</button>
    </div>
  </section>

  <section class="chooser hidden" id="chooserBox">
    <div>Which one?</div>
    <div id="chooserOptions"></div>
  </section>

  <section class="log">
    <h2>Activity</h2>
    <ol id="log"></ol>
  </section>

  <script src="speech.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
